name: nf-env2
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.14.7
  - openjdk=25.0.2
  - nextflow=26.04.6

  # QC / trimming
  - fastqc=0.12.1
  - multiqc=1.35
  - trim-galore=2.3.0

  # Aligners
  - bismark=3.1.0
  - bowtie2=2.5.5
  - hisat2=2.2.3
  - minimap2=2.31

  # SAM/BAM/interval
  - samtools=1.24
  - bedtools=2.31.1
  - htslib=1.24

  # NCBI
  - ncbi-datasets-cli=18.36.0